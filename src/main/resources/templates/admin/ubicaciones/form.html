<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead(${pageTitle})}"></head>
<body class="ms-admin-body">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar(${pageTitle})}"></div>
  <div class="p-4 ms-admin-form-wrapper">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>
    <a th:href="@{/admin/ubicaciones}" class="btn btn-ms-outline btn-sm px-3 rounded mb-4">
      <i class="bi bi-arrow-left me-1"></i>Volver
    </a>

    <div class="ms-card p-4">
      <form th:action="@{/admin/ubicaciones/guardar}" method="post" th:object="${ubicacion}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{idUbicacion}"/>

        <div class="row g-3">
          <!-- Nombre -->
          <div class="col-12">
            <label class="form-label fw-semibold ms-form-label">
              Nombre <span class="text-danger">*</span>
            </label>
            <input type="text" th:field="*{nombre}" class="form-control ms-form-control"
                   placeholder="Ej: Isla de Mouro" required/>
          </div>

          <!-- Tipo de Fondo -->
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold ms-form-label">Tipo de Fondo</label>
            <input type="text" th:field="*{tipoFondo}" class="form-control ms-form-control"
                   placeholder="Ej: Rocoso, Arenoso, Mixto..."/>
          </div>

          <!-- Profundidad Máxima -->
          <div class="col-12 col-md-3">
            <label class="form-label fw-semibold ms-form-label">Profundidad Máx. (m)</label>
            <input type="number" th:field="*{profundidadMax}" class="form-control ms-form-control"
                   placeholder="Ej: 30"/>
          </div>

          <!-- Nivel de Buceo -->
          <div class="col-12 col-md-3">
            <label class="form-label fw-semibold ms-form-label">Nivel de Buceo</label>
            <input type="text" th:field="*{nivelBuceo}" class="form-control ms-form-control"
                   placeholder="Ej: Open Water, Avanzado..."/>
          </div>

          <!-- Botones -->
          <div class="col-12 d-flex gap-3 pt-2">
            <button type="submit" class="btn btn-ms-primary px-5 py-2 rounded fw-semibold">
              <i class="bi bi-save me-2"></i><span th:text="${accion}">Guardar</span>
            </button>
            <a th:href="@{/admin/ubicaciones}" class="btn btn-ms-outline px-4 py-2 rounded">Cancelar</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
</body>
</html>
