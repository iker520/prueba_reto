<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead(${pageTitle})}"></head>
<body class="ms-admin-body">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar(${pageTitle})}"></div>
  <div class="p-4">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1" style="color:var(--ms-text)">Ubicaciones</h2>
        <p class="text-muted mb-0 small">Gestiona los puntos de buceo y localizaciones disponibles</p>
      </div>
      <a th:href="@{/admin/ubicaciones/nueva}" class="btn btn-ms-primary px-4 py-2 rounded">
        <i class="bi bi-plus-lg me-2"></i>Nueva Ubicación
      </a>
    </div>

    <!-- Tabla -->
    <div class="ms-card p-0 overflow-hidden">
      <table class="table table-hover mb-0 ms-admin-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Tipo de Fondo</th>
            <th>Prof. Máx (m)</th>
            <th>Nivel Buceo</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(ubicaciones)}">
            <td colspan="5" class="text-center py-5 text-muted">
              <i class="bi bi-geo-alt fs-2 d-block mb-2"></i>
              No hay ubicaciones registradas aún.
            </td>
          </tr>
          <tr th:each="ubi : ${ubicaciones}">
            <td class="fw-semibold" th:text="${ubi.nombre}">—</td>
            <td th:text="${ubi.tipoFondo != null ? ubi.tipoFondo : '—'}">—</td>
            <td th:text="${ubi.profundidadMax != null ? ubi.profundidadMax + ' m' : '—'}">—</td>
            <td th:text="${ubi.nivelBuceo != null ? ubi.nivelBuceo : '—'}">—</td>
            <td class="text-end">
              <a th:href="@{/admin/ubicaciones/editar/{id}(id=${ubi.idUbicacion})}"
                 class="btn btn-sm btn-ms-outline px-3 me-1">
                <i class="bi bi-pencil me-1"></i>Editar
              </a>
              <form th:action="@{/admin/ubicaciones/eliminar/{id}(id=${ubi.idUbicacion})}"
                    method="post" class="d-inline"
                    onsubmit="return confirm('¿Eliminar esta ubicación? Se desvinculará de todas las actividades.')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-danger px-3">
                  <i class="bi bi-trash me-1"></i>Eliminar
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
</body>
</html>
