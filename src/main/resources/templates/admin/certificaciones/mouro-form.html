<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead('Nueva Certificación MouroSub')}"></head>
<body class="ms-admin-body">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar('Expedir Certificación MouroSub')}"></div>
  <div class="p-4">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>

    <div class="ms-card p-4" style="max-width:720px;">
      <form th:action="@{/admin/certificaciones/mouro/nueva}" method="post"
            enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Usuario -->
        <div class="mb-3">
          <label class="form-label fw-semibold" for="dniUsuario">Usuario <span class="text-danger">*</span></label>
          <select id="dniUsuario" name="dniUsuario" class="form-select" required>
            <option value="">— Selecciona un usuario —</option>
            <option th:each="u : ${usuarios}"
                    th:value="${u.dniUsuario}"
                    th:text="${u.nombre + ' ' + u.apellido1 + ' (' + u.email + ')'}">
            </option>
          </select>
        </div>

        <!-- Título -->
        <div class="mb-3">
          <label class="form-label fw-semibold" for="titulo">Título de la certificación <span class="text-danger">*</span></label>
          <input type="text" id="titulo" name="titulo" class="form-control"
                 placeholder="Ej: Open Water Diver" required maxlength="200"/>
        </div>

        <!-- Entidad -->
        <div class="mb-3">
          <label class="form-label fw-semibold" for="entidadCertificadora">Entidad certificadora</label>
          <input type="text" id="entidadCertificadora" name="entidadCertificadora" class="form-control"
                 placeholder="MouroSub / PADI / CMAS..." maxlength="150"/>
        </div>

        <!-- Fechas -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="fechaInicio">Fecha de expedición</label>
            <input type="date" id="fechaInicio" name="fechaInicio" class="form-control"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="fechaFin">Fecha de vencimiento <small class="text-muted">(opcional)</small></label>
            <input type="date" id="fechaFin" name="fechaFin" class="form-control"/>
          </div>
        </div>

        <!-- Documento -->
        <div class="mb-4">
          <label class="form-label fw-semibold" for="documento">
            Documento PDF / Imagen
            <small class="text-muted ms-2">(max. 10 MB)</small>
          </label>
          <input type="file" id="documento" name="documento" class="form-control"
                 accept=".pdf,.jpg,.jpeg,.png,.webp"/>
          <div class="form-text">Se guardará localmente en el servidor. Podrá descargarse desde la ficha del usuario.</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-ms-primary px-4 rounded">
            <i class="bi bi-award me-2"></i>Expedir certificación
          </button>
          <a th:href="@{/admin/certificaciones/mouro}" class="btn btn-ms-outline px-4 rounded">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
</body>
</html>
