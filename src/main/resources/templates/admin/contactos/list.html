<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead(${pageTitle})}"></head>
<body class="ms-admin-body">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar(${pageTitle})}"></div>
  <div class="p-4">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>

    <!-- Cabecera -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1" style="color:var(--ms-text)">
          Contactos
          <span th:if="${totalNuevos > 0}"
                class="badge rounded-pill ms-1"
                style="background:var(--ms-primary);font-size:.7rem"
                th:text="${totalNuevos} + ' nuevos'">0</span>
        </h2>
        <p class="text-muted mb-0 small">Mensajes recibidos desde el formulario de contacto</p>
      </div>
    </div>

    <!-- Filtros de estado -->
    <div class="d-flex flex-wrap gap-2 mb-4">
      <a th:href="@{/admin/contactos}" class="btn btn-sm rounded-pill px-3"
         th:classappend="${estadoFiltro == ''} ? 'btn-ms-primary' : 'btn-ms-outline'">
        Todos
      </a>
      <a th:each="est : ${estados}"
         th:href="@{/admin/contactos(estado=${est})}"
         class="btn btn-sm rounded-pill px-3"
         th:classappend="${estadoFiltro == est} ? 'btn-ms-primary' : 'btn-ms-outline'"
         th:text="${est}">ESTADO</a>
    </div>

    <!-- Tabla -->
    <div class="ms-card p-0 overflow-hidden">
      <table class="table table-hover mb-0 ms-admin-table">
        <thead>
          <tr>
            <th>Remitente</th>
            <th>Email</th>
            <th>Interés</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(contactos)}">
            <td colspan="6" class="text-center py-5 text-muted">
              <i class="bi bi-envelope fs-2 d-block mb-2"></i>
              No hay mensajes
              <span th:if="${estadoFiltro != ''}">con estado <strong th:text="${estadoFiltro}"></strong></span>.
            </td>
          </tr>
          <tr th:each="c : ${contactos}"
              th:classappend="${c.estado == 'NUEVA'} ? 'table-warning fw-semibold' : ''">
            <td>
              <a th:href="@{/admin/contactos/{id}(id=${c.idContacto})}"
                 class="text-decoration-none" style="color:inherit"
                 th:text="${c.nombre}">Nombre</a>
            </td>
            <td class="text-muted" th:text="${c.email}">email</td>
            <td>
              <span th:if="${c.interes != null}" class="ms-badge ms-badge-outline small"
                    th:text="${c.interes}">—</span>
              <span th:unless="${c.interes != null}" class="text-muted">—</span>
            </td>
            <td class="text-muted small"
                th:text="${#temporals.format(c.fechaEnvio, 'dd/MM/yyyy HH:mm')}">—</td>
            <td>
              <span class="badge rounded-pill"
                    th:classappend="${c.estado == 'NUEVA'} ? 'bg-warning text-dark' :
                                    (${c.estado == 'LEIDA'} ? 'bg-info text-dark' : 'bg-success')"
                    th:text="${c.estado}">ESTADO</span>
            </td>
            <td class="text-end">
              <a th:href="@{/admin/contactos/{id}(id=${c.idContacto})}"
                 class="btn btn-sm btn-ms-outline px-3 me-1" title="Ver mensaje">
                <i class="bi bi-eye"></i>
              </a>
              <form th:action="@{/admin/contactos/eliminar/{id}(id=${c.idContacto})}"
                    method="post" class="d-inline"
                    onsubmit="return confirm('¿Eliminar este mensaje?')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-danger px-3" title="Eliminar">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
</body>
</html>
