<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead(${pageTitle})}"></head>
<!-- TipTap CDN -->
<head>
  <script src="https://cdn.jsdelivr.net/npm/@tiptap/core@2.4.0/dist/index.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tiptap/starter-kit@2.4.0/dist/index.umd.min.js"></script>
</head>
<body class="ms-admin-body">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar(${pageTitle})}" ></div>
  <div class="p-4 ms-admin-form-wrapper">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>
    <a th:href="@{/admin/actividades}" class="btn btn-ms-outline btn-sm px-3 rounded mb-4">
      <i class="bi bi-arrow-left me-1"></i>Volver
    </a>

    <div class="ms-card p-4">
      <form th:action="@{/admin/actividades/guardar}" method="post" th:object="${actividad}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{idActividad}"/>

        <div class="row g-3">
          <!-- Nombre -->
          <div class="col-12">
            <label class="form-label fw-semibold ms-form-label">
              Nombre <span class="text-danger">*</span>
            </label>
            <input type="text" th:field="*{nombre}" class="form-control ms-form-control" required/>
          </div>

          <!-- Tipo + Nivel -->
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold ms-form-label">Tipo</label>
            <select th:field="*{tipo}" class="form-select ms-form-control">
              <option value="">— Selecciona tipo —</option>
              <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}">TIPO</option>
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold ms-form-label">Nivel requerido</label>
            <select th:field="*{nivel}" class="form-select ms-form-control">
              <option value="">— Selecciona nivel —</option>
              <option th:each="n : ${niveles}" th:value="${n}" th:text="${n}">NIVEL</option>
            </select>
          </div>

          <!-- Subtipo (visible y relevante según el tipo elegido) -->
          <div class="col-12" id="subtipo-wrapper">
            <label class="form-label fw-semibold ms-form-label">Subcategoría</label>
            <select id="subtipoSelect" th:field="*{subtipo}" class="form-select ms-form-control">
              <option value="">— Sin subcategoría —</option>
              <!-- Opciones para CURSO -->
              <optgroup label="Cursos" class="subtipo-grupo subtipo-CURSO" style="display:none">
                <option value="Apnea">Apnea</option>
                <option value="Deportivos y Especialidad">Deportivos y Especialidad</option>
                <option value="Formación Emergencia y Primeros Auxilios">Formación Emergencia y Primeros Auxilios</option>
                <option value="Técnico RX">Técnico RX</option>
                <option value="Profesionales">Profesionales</option>
              </optgroup>
              <!-- Opciones para INMERSION -->
              <optgroup label="Inmersiones" class="subtipo-grupo subtipo-INMERSION" style="display:none">
                <option value="Isla de Mouro">Isla de Mouro</option>
                <option value="El Palacio">El Palacio</option>
                <option value="Isla de Santa Marina">Isla de Santa Marina</option>
                <option value="Cabo Menor y Cabo Mayor">Cabo Menor y Cabo Mayor</option>
                <option value="Bajos y Cabezos">Bajos y Cabezos</option>
                <option value="Pecios">Pecios</option>
              </optgroup>
              <!-- Opciones para OFERTA -->
              <optgroup label="Ofertas" class="subtipo-grupo subtipo-OFERTA" style="display:none">
                <option value="Formación">Formación</option>
                <option value="Actividades">Actividades</option>
                <option value="Material">Material</option>
              </optgroup>
            </select>
          </div>

          <!-- Precio + Duración + Plazas -->
          <div class="col-12 col-md-4">
            <label class="form-label fw-semibold ms-form-label">Precio (€)</label>
            <input type="number" step="0.01" th:field="*{precio}" class="form-control ms-form-control" placeholder="0.00"/>
          </div>
          <div class="col-md-4">
            <label class="form-label ms-form-label">Duración (minutos)</label>
            <input type="number" th:field="*{duracion}" class="form-control ms-form-control" placeholder="Ej: 120"/>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label fw-semibold ms-form-label">Plazas máximas</label>
            <input type="number" th:field="*{plazasMaximas}" class="form-control ms-form-control"/>
          </div>

          <!-- URL imagen -->
          <div class="col-12">
            <label class="form-label fw-semibold ms-form-label">URL de imagen</label>
            <input type="url" th:field="*{imagenUrl}" class="form-control ms-form-control" placeholder="https://..."/>
          </div>

          <!-- Descripción corta -->
          <div class="col-12">
            <label class="form-label fw-semibold ms-form-label">Descripción corta</label>
            <textarea th:field="*{descripcion}" class="form-control ms-form-control" rows="3"
                      placeholder="Descripción breve que aparece en las tarjetas del listado..."></textarea>
          </div>

          <!-- TipTap: Descripción completa HTML -->
          <div class="col-12">
            <label class="form-label fw-semibold ms-form-label">
              Descripción completa (HTML)
              <span class="ms-badge ms-badge-outline ms-1 ms-badge-tiptap">TipTap</span>
            </label>
            <!-- Campo oculto donde se almacena el HTML -->
            <input type="hidden" id="descripcionHtmlField" th:field="*{descripcionHtml}"/>
            <!-- Wrapper del editor -->
            <div data-tiptap-target="descripcionHtmlField">
              <div class="tiptap-toolbar">
                <button type="button" data-action="bold"><b>B</b></button>
                <button type="button" data-action="italic"><i>I</i></button>
                <button type="button" data-action="h2">H2</button>
                <button type="button" data-action="h3">H3</button>
                <button type="button" data-action="bullet"><i class="bi bi-list-ul"></i></button>
                <button type="button" data-action="ordered"><i class="bi bi-list-ol"></i></button>
                <button type="button" data-action="blockquote">&ldquo;</button>
                <button type="button" data-action="undo"><i class="bi bi-arrow-counterclockwise"></i></button>
                <button type="button" data-action="redo"><i class="bi bi-arrow-clockwise"></i></button>
              </div>
              <div id="tiptap-editor" class="tiptap-editor-area"></div>
            </div>
          </div>

          <!-- Ubicaciones asociadas -->
          <div class="col-12" th:if="${todasUbicaciones != null and !#lists.isEmpty(todasUbicaciones)}">
            <label class="form-label fw-semibold ms-form-label">
              <i class="bi bi-geo-alt me-1"></i>Ubicaciones asociadas
            </label>
            <div class="p-3 rounded d-flex flex-wrap gap-3"
                 style="background:var(--ms-bg);border:1px solid var(--ms-border)">
              <div th:each="ubi : ${todasUbicaciones}" class="form-check">
                <input class="form-check-input" type="checkbox"
                       name="ubicacionIds"
                       th:value="${ubi.idUbicacion}"
                       th:id="'ubi_' + ${ubi.idUbicacion}"
                       th:checked="${actividad.ubicaciones != null and actividad.ubicaciones.contains(ubi)}"/>
                <label class="form-check-label ms-check-label"
                       th:for="'ubi_' + ${ubi.idUbicacion}"
                       th:text="${ubi.nombre}">Ubicación</label>
              </div>
            </div>

          </div>
          <div class="col-12" th:unless="${todasUbicaciones != null and !#lists.isEmpty(todasUbicaciones)}">
            <div class="alert alert-info py-2 small mb-0">
              <i class="bi bi-info-circle me-1"></i>
              No hay ubicaciones creadas.
              <a th:href="@{/admin/ubicaciones/nueva}" class="alert-link">Crear una ubicación</a>
            </div>
          </div>

          <!-- Checkboxes activa / destacada -->
          <div class="col-12 d-flex gap-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" th:field="*{activa}" id="activa"/>
              <label class="form-check-label ms-check-label" for="activa">Actividad activa (visible en la web)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" th:field="*{destacada}" id="destacada"/>
              <label class="form-check-label ms-check-label" for="destacada">Destacar en inicio</label>
            </div>
          </div>

          <!-- Botones -->
          <div class="col-12 d-flex gap-3 pt-2">
            <button type="submit" class="btn btn-ms-primary px-5 py-2 rounded fw-semibold">
              <i class="bi bi-save me-2"></i><span th:text="${accion}">Guardar</span>
            </button>
            <a th:href="@{/admin/actividades}" class="btn btn-ms-outline px-4 py-2 rounded">Cancelar</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
<script th:src="@{/js/admin-tiptap.js}"></script>

<script src="/js/admin-tiptap-init.js"></script>
<script>
  (function () {
    // Usar selectores por 'name' porque th:field sobreescribe el atributo 'id'
    const tipoSel    = document.querySelector('select[name="tipo"]');
    const subtipoSel = document.querySelector('select[name="subtipo"]');
    if (!tipoSel || !subtipoSel) return;

    function actualizarSubtipo() {
      const tipoVal = tipoSel.value.toUpperCase();
      document.querySelectorAll('.subtipo-grupo').forEach(og => {
        og.style.display = 'none';
        og.querySelectorAll('option').forEach(o => o.disabled = true);
      });
      if (tipoVal) {
        const grupo = document.querySelector('.subtipo-' + tipoVal);
        if (grupo) {
          grupo.style.display = '';
          grupo.querySelectorAll('option').forEach(o => o.disabled = false);
        }
      }
    }

    tipoSel.addEventListener('change', function () {
      subtipoSel.value = '';
      actualizarSubtipo();
    });

    // Al cargar la página (modo edición), mostrar el grupo correcto
    actualizarSubtipo();
  })();
</script>
</body>
</html>
