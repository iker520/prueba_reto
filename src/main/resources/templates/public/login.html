<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/base :: head(${pageTitle})}"></head>
<body class="page-body-login">
<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
  <div class="ms-login-wrapper">
    <!-- Logo/Icono -->
    <div class="text-center mb-4">
      <div class="ms-login-icon-wrap">
        <i class="bi bi-water ms-login-icon"></i>
      </div>
      <h1 class="ms-login-title">Bienvenido de nuevo</h1>
      <p class="ms-login-subtitle">Accede a tu panel de buceador en MouroSub</p>
    </div>

    <!-- Card de login -->
    <div class="ms-card p-4">
      <!-- Error de login -->
      <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>Credenciales incorrectas. Inténtalo de nuevo.</span>
      </div>
      <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center gap-2 mb-3" role="alert">
        <i class="bi bi-info-circle-fill"></i>
        <span>Has cerrado sesión correctamente.</span>
      </div>

      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
          <label class="form-label fw-semibold ms-form-label" for="username">
            Correo electrónico
          </label>
          <div class="input-group">
            <span class="input-group-text ms-input-addon">
              <i class="bi bi-person ms-input-addon-icon"></i>
            </span>
            <input type="email" class="form-control ms-form-control border-start-0"
                   id="username" name="username"
                   placeholder="ejemplo@mourosub.com" required autofocus/>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between mb-1">
            <label class="form-label fw-semibold mb-0 ms-form-label" for="password">
              Contraseña
            </label>
            <a href="#" class="ms-forgot-link">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text ms-input-addon">
              <i class="bi bi-lock ms-input-addon-icon"></i>
            </span>
            <input type="password" class="form-control ms-form-control border-start-0"
                   id="password" name="password" placeholder="••••••••" required/>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" name="remember-me" id="remember"/>
          <label class="form-check-label ms-check-label" for="remember">
            Recordarme en este equipo
          </label>
        </div>

        <button type="submit" class="btn btn-ms-primary w-100 py-3 rounded fw-semibold">
          Iniciar Sesión <i class="bi bi-box-arrow-in-right ms-2"></i>
        </button>
      </form>

      <hr class="ms-login-divider"/>
      <div th:if="${registroExitoso}" class="alert alert-success d-flex align-items-center gap-2 mb-3" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${registroExitoso}"></span>
      </div>
      <p class="text-center mb-0 ms-login-footer-text">
        ¿No tienes una cuenta?
        <a th:href="@{/registro}" class="ms-login-footer-link">Regístrate aquí</a>
      </p>
    </div>

    <p class="text-center mt-3">
      <a th:href="@{/}" class="ms-back-link">
        <i class="bi bi-arrow-left me-1"></i>Volver al inicio
      </a>
    </p>
  </div>
</main>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
