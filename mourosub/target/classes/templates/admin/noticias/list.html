<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead('Noticias')}"></head>
<body class="ms-admin-body">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar('Gestión de Noticias')}"></div>
  <div class="p-4">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>
    <div class="d-flex justify-content-end mb-4">
      <a th:href="@{/admin/noticias/nueva}" class="btn btn-ms-primary px-4 py-2 rounded">
        <i class="bi bi-plus-lg me-2"></i>Nueva Noticia
      </a>
    </div>
    <div class="ms-card p-0">
      <div class="table-responsive">
        <table class="ms-table">
          <thead><tr>
            <th>ID</th><th>Título</th><th>Categoría</th><th>Fecha</th><th>Publicada</th><th>Acciones</th>
          </tr></thead>
          <tbody>
          <tr th:each="n : ${noticias}">
            <td class="fw-semibold ms-table-id" th:text="${n.idNoticia}">—</td>
            <td class="fw-semibold" th:text="${n.titulo}">—</td>
            <td><span class="ms-badge" th:text="${n.categoria}">—</span></td>
            <td class="ms-table-cell-sm" th:text="${n.fechaPublicacion != null ? #temporals.format(n.fechaPublicacion,'dd/MM/yyyy') : '—'}">—</td>
            <td>
              <i class="bi" th:classappend="${n.publicada} ? 'bi-check-circle-fill text-success' : 'bi-x-circle-fill text-danger'"></i>
            </td>
            <td>
              <div class="d-flex gap-2">
                <a th:href="@{/noticias/{id}(id=${n.idNoticia})}" target="_blank"
                   class="btn btn-sm btn-ms-outline px-2 rounded" title="Ver en web">
                  <i class="bi bi-eye"></i>
                </a>
                <a th:href="@{/admin/noticias/editar/{id}(id=${n.idNoticia})}"
                   class="btn btn-sm btn-ms-outline px-3 rounded"><i class="bi bi-pencil"></i></a>
                <form th:action="@{/admin/noticias/eliminar/{id}(id=${n.idNoticia})}" method="post"
                      onsubmit="return confirm('¿Eliminar esta noticia?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-danger px-3 rounded"><i class="bi bi-trash"></i></button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(noticias)}">
            <td colspan="6" class="text-center py-5 ms-table-empty">
              No hay noticias. <a th:href="@{/admin/noticias/nueva}" class="ms-table-link">Crea la primera</a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
</body>
</html>
