<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead(${pageTitle})}"></head>
<body style="background:var(--ms-background);">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar(${pageTitle})}"></div>
  <div class="p-4" style="max-width:860px;">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>
    <a th:href="@{/admin/instructores}" class="btn btn-ms-outline btn-sm px-3 rounded mb-4">
      <i class="bi bi-arrow-left me-1"></i>Volver
    </a>
    <div class="ms-card p-4">
      <form th:action="@{/admin/instructores/guardar}" method="post" th:object="${instructor}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="row g-3">
          <div class="col-12 col-md-4">
            <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);">DNI <span class="text-danger">*</span></label>
            <input type="text" th:field="*{dniInstructor}" class="form-control ms-form-control" required
                   th:readonly="${instructor.dniInstructor != null and !#strings.isEmpty(instructor.dniInstructor)}"/>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);">Nombre <span class="text-danger">*</span></label>
            <input type="text" th:field="*{nombre}" class="form-control ms-form-control" required/>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);">Primer apellido</label>
            <input type="text" th:field="*{apellido1}" class="form-control ms-form-control"/>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);">Segundo apellido</label>
            <input type="text" th:field="*{apellido2}" class="form-control ms-form-control"/>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);">Fecha nacimiento</label>
            <input type="date" th:field="*{fechaNac}" class="form-control ms-form-control"/>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);">Teléfono</label>
            <input type="tel" th:field="*{telefono}" class="form-control ms-form-control"/>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);">Email</label>
            <input type="email" th:field="*{email}" class="form-control ms-form-control"/>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);">Título PADI</label>
            <select th:field="*{tituloPadi}" class="form-select ms-form-control">
              <option value="">— Sin título —</option>
              <option th:each="t : ${titulos}" th:value="${t}" th:text="${t}">TÍTULO</option>
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);">Especialidad</label>
            <input type="text" th:field="*{especialidad}" class="form-control ms-form-control" placeholder="Ej: Buceo técnico, fotografía..."/>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);">URL Foto</label>
            <input type="url" th:field="*{fotoUrl}" class="form-control ms-form-control" placeholder="https://..."/>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);">Experiencia / Bio</label>
            <textarea th:field="*{experiencia}" class="form-control ms-form-control" rows="4"
                      placeholder="Describe la experiencia del instructor..."></textarea>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activo"/>
              <label class="form-check-label" style="font-size:0.875rem;" for="activo">Instructor activo (aparece en Conócenos)</label>
            </div>
          </div>
          <div class="col-12 d-flex gap-3 pt-2">
            <button type="submit" class="btn btn-ms-primary px-5 py-2 rounded fw-semibold">
              <i class="bi bi-save me-2"></i><span th:text="${accion}">Guardar</span>
            </button>
            <a th:href="@{/admin/instructores}" class="btn btn-ms-outline px-4 py-2 rounded">Cancelar</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
</body>
</html>
