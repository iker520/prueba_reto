<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead('Actividades')}"></head>
<body class="ms-admin-body">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar('Gestión de Actividades')}"></div>
  <div class="p-4">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
      <p class="mb-0 ms-admin-list-count">
        Total: <strong th:text="${#lists.size(actividades)}">0</strong> actividades registradas
      </p>
      <a th:href="@{/admin/actividades/nueva}" class="btn btn-ms-primary px-4 py-2 rounded">
        <i class="bi bi-plus-lg me-2"></i>Nueva Actividad
      </a>
    </div>
    <div class="ms-card p-0">
      <div class="table-responsive">
        <table class="ms-table">
          <thead><tr>
            <th>ID</th><th>Nombre</th><th>Tipo</th><th>Nivel</th><th>Precio</th><th>Activa</th><th>Acciones</th>
          </tr></thead>
          <tbody>
          <tr th:each="act : ${actividades}">
            <td class="fw-semibold ms-table-id" th:text="${act.idActividad}">—</td>
            <td class="fw-semibold" th:text="${act.nombre}">—</td>
            <td><span class="ms-badge" th:text="${act.tipo}">TIPO</span></td>
            <td th:text="${act.nivel != null ? act.nivel : '—'}">—</td>
            <td th:text="${act.precio != null ? act.precio + '€' : '—'}">—</td>
            <td>
              <i class="bi" th:classappend="${act.activa} ? 'bi-check-circle-fill text-success' : 'bi-x-circle-fill text-danger'"></i>
            </td>
            <td>
              <div class="d-flex gap-2">
                <a th:href="@{/admin/actividades/editar/{id}(id=${act.idActividad})}"
                   class="btn btn-sm btn-ms-outline px-3 rounded">
                  <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{/admin/actividades/eliminar/{id}(id=${act.idActividad})}" method="post"
                      onsubmit="return confirm('¿Eliminar esta actividad?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-danger px-3 rounded">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(actividades)}">
            <td colspan="7" class="text-center py-5 ms-table-empty">
              No hay actividades. <a th:href="@{/admin/actividades/nueva}" class="ms-table-link">Crea la primera</a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
</body>
</html>
