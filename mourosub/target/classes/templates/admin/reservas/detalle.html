<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead(${pageTitle})}"></head>
<body class="ms-admin-body">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar(${pageTitle})}"></div>
  <div class="p-4 ms-admin-form-wrapper">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>
    <a th:href="@{/admin/reservas}" class="btn btn-ms-outline btn-sm px-3 rounded mb-4">
      <i class="bi bi-arrow-left me-1"></i>Volver
    </a>

    <div class="row g-4">
      <!-- Info Reserva -->
      <div class="col-12 col-md-6">
        <div class="ms-card p-4">
          <h5 class="fw-semibold mb-3">Reserva <span th:text="'#' + ${reserva.idReserva}">#0</span></h5>
          <table class="table table-borderless ms-detail-table">
            <tr>
              <td class="ms-detail-td-label">Fecha</td>
              <td class="fw-semibold" th:text="${#temporals.format(reserva.fechaReserva,'dd MMMM yyyy')}">—</td>
            </tr>
            <tr>
              <td class="ms-detail-td-label">Total</td>
              <td class="fw-semibold" th:text="${reserva.total != null ? reserva.total + '€' : 'N/A'}">—</td>
            </tr>
            <tr>
              <td class="ms-detail-td-label">Estado</td>
              <td>
                <span class="badge rounded-pill px-3 py-1"
                      th:classappend="${reserva.estado == 'PENDIENTE'} ? 'badge-pendiente' :
                                     (${reserva.estado == 'CONFIRMADA'} ? 'badge-confirmada' :
                                     (${reserva.estado == 'CANCELADA'} ? 'badge-cancelada' : 'badge-completada'))"
                      th:text="${reserva.estado}">Estado</span>
              </td>
            </tr>
          </table>
        </div>
      </div>

      <!-- Cambiar estado -->
      <div class="col-12 col-md-6">
        <div class="ms-card p-4">
          <h5 class="fw-semibold mb-3">Cambiar Estado</h5>
          <form th:action="@{/admin/reservas/{id}/estado(id=${reserva.idReserva})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <select name="estado" class="form-select ms-form-control mb-3">
              <option th:each="est : ${estados}"
                      th:value="${est}"
                      th:text="${est}"
                      th:selected="${reserva.estado == est}">EST</option>
            </select>
            <button type="submit" class="btn btn-ms-primary w-100 py-2 rounded fw-semibold">
              <i class="bi bi-arrow-repeat me-2"></i>Actualizar estado
            </button>
          </form>
        </div>
      </div>

      <!-- Usuarios asociados -->
      <div class="col-12" th:if="${not #lists.isEmpty(reserva.usuarios)}">
        <div class="ms-card p-4">
          <h5 class="fw-semibold mb-3">Usuarios en esta reserva</h5>
          <div class="table-responsive">
            <table class="ms-table">
              <thead><tr><th>DNI</th><th>Inicio</th><th>Fin</th><th>Cantidad</th></tr></thead>
              <tbody>
              <tr th:each="ur : ${reserva.usuarios}">
                <td th:text="${ur.dniUsuario}">—</td>
                <td th:text="${ur.fechaInicio}">—</td>
                <td th:text="${ur.fechaFin}">—</td>
                <td th:text="${ur.cantidad}">—</td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
</body>
</html>
