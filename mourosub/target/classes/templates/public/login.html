<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/base :: head(${pageTitle})}"></head>
<body style="background:var(--ms-background); min-height:100vh; display:flex; flex-direction:column;">
<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
  <div style="width:100%; max-width:440px; padding:0 1rem;">
    <!-- Logo/Icono -->
    <div class="text-center mb-4">
      <div style="width:64px; height:64px; background:var(--ms-primary-container); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; margin-bottom:1rem;">
        <i class="bi bi-water" style="font-size:1.8rem; color:var(--ms-on-primary-cont);"></i>
      </div>
      <h1 style="font-size:1.8rem; font-weight:700; color:var(--ms-primary);">Bienvenido de nuevo</h1>
      <p style="color:var(--ms-on-surface-var); font-size:0.9rem;">Accede a tu panel de buceador en MouroSub</p>
    </div>

    <!-- Card de login -->
    <div class="ms-card p-4">
      <!-- Error de login -->
      <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>Credenciales incorrectas. Inténtalo de nuevo.</span>
      </div>
      <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center gap-2 mb-3" role="alert">
        <i class="bi bi-info-circle-fill"></i>
        <span>Has cerrado sesión correctamente.</span>
      </div>

      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:0.85rem; color:var(--ms-on-surface-var);" for="username">
            Correo electrónico
          </label>
          <div class="input-group">
            <span class="input-group-text" style="background:var(--ms-surface-low); border-color:var(--ms-outline-variant);">
              <i class="bi bi-person" style="color:var(--ms-outline);"></i>
            </span>
            <input type="email" class="form-control ms-form-control border-start-0"
                   id="username" name="username"
                   placeholder="ejemplo@mourosub.com" required autofocus/>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between mb-1">
            <label class="form-label fw-semibold mb-0" style="font-size:0.85rem; color:var(--ms-on-surface-var);" for="password">
              Contraseña
            </label>
            <a href="#" style="font-size:0.8rem; color:var(--ms-primary);">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text" style="background:var(--ms-surface-low); border-color:var(--ms-outline-variant);">
              <i class="bi bi-lock" style="color:var(--ms-outline);"></i>
            </span>
            <input type="password" class="form-control ms-form-control border-start-0"
                   id="password" name="password" placeholder="••••••••" required/>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" name="remember-me" id="remember"/>
          <label class="form-check-label" style="font-size:0.875rem; color:var(--ms-on-surface-var);" for="remember">
            Recordarme en este equipo
          </label>
        </div>

        <button type="submit" class="btn btn-ms-primary w-100 py-3 rounded fw-semibold">
          Iniciar Sesión <i class="bi bi-box-arrow-in-right ms-2"></i>
        </button>
      </form>

      <hr style="border-color:var(--ms-outline-variant); margin:1.5rem 0;"/>
      <p class="text-center mb-0" style="font-size:0.875rem; color:var(--ms-on-surface-var);">
        ¿No tienes una cuenta?
        <a th:href="@{/contacto}" style="color:var(--ms-primary); font-weight:700;">Contáctanos</a>
      </p>
    </div>

    <p class="text-center mt-3">
      <a th:href="@{/}" style="color:var(--ms-on-surface-var); font-size:0.875rem; text-decoration:none;">
        <i class="bi bi-arrow-left me-1"></i>Volver al inicio
      </a>
    </p>
  </div>
</main>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
