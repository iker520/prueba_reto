<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<!-- ============================================================
     FRAGMENTO: head
     Uso: <head th:replace="~{layout/base :: head(${pageTitle})}">
     ============================================================ -->
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="MouroSub - Escuela de buceo profesional en Santander, Cantabria. Cursos PADI, inmersiones y formación técnica."/>
  <title th:text="${pageTitle} + ' | MouroSub Diving School'">MouroSub Diving School</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

  <!-- MouroSub Custom CSS -->
  <link rel="stylesheet" th:href="@{/css/mourosub.css}"/>
</head>

<!-- ============================================================
     FRAGMENTO: navbar
     Uso: <nav th:replace="~{layout/base :: navbar(${pageTitle})}">
     ============================================================ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg ms-navbar fixed-top" id="mainNav">
  <div class="container-ms w-100 d-flex align-items-center justify-content-between" style="max-width:1280px; margin:0 auto; padding:0 1.5rem;">

    <!-- Brand -->
    <a class="navbar-brand" th:href="@{/}">MouroSub</a>

    <!-- Hamburger mobile -->
    <button class="navbar-toggler border-0" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarMain"
            aria-controls="navbarMain" aria-expanded="false" aria-label="Menú">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 py-2 py-lg-0">
        <li class="nav-item">
          <a class="nav-link" th:classappend="${#httpServletRequest.requestURI == '/servicios'} ? 'active' : ''"
             th:href="@{/servicios}">Servicios</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${#httpServletRequest.requestURI == '/conocenos'} ? 'active' : ''"
             th:href="@{/conocenos}">Conócenos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${#httpServletRequest.requestURI.startsWith('/noticias')} ? 'active' : ''"
             th:href="@{/noticias}">Noticias</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${#httpServletRequest.requestURI == '/contacto'} ? 'active' : ''"
             th:href="@{/contacto}">Contacto</a>
        </li>
        <li class="nav-item ms-lg-2">
          <!-- Si no está autenticado: Login | Si está autenticado: Admin -->
          <a sec:authorize="!isAuthenticated()"
             class="btn btn-ms-primary px-4 py-2 rounded"
             th:href="@{/login}">Login</a>
          <a sec:authorize="isAuthenticated()"
             class="btn btn-ms-primary px-4 py-2 rounded"
             th:href="@{/admin}">
            <i class="bi bi-speedometer2 me-1"></i>Admin
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ============================================================
     FRAGMENTO: footer
     Uso: <footer th:replace="~{layout/base :: footer}">
     ============================================================ -->
<footer th:fragment="footer" class="ms-footer py-4 mt-5">
  <div style="max-width:1280px; margin:0 auto; padding:0 1.5rem;">
    <div class="row align-items-center gy-3">
      <div class="col-md-4">
        <div class="footer-brand mb-1">MouroSub</div>
        <p class="mb-0" style="font-size:0.8rem; color:var(--ms-on-surface-var);">
          Tu escuela de confianza para la exploración submarina profesional y recreativa.
        </p>
      </div>
      <div class="col-md-4 d-flex flex-wrap gap-3 justify-content-md-center">
        <a th:href="@{/servicios}">Servicios</a>
        <a th:href="@{/conocenos}">Conócenos</a>
        <a th:href="@{/noticias}">Noticias</a>
        <a th:href="@{/contacto}">Contacto</a>
      </div>
      <div class="col-md-4 text-md-end">
        <p class="mb-0" style="font-size:0.8rem; color:var(--ms-on-surface-var);">
          &copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2025</span>
          MouroSub Diving School. Todos los derechos reservados.
        </p>
      </div>
    </div>
  </div>
</footer>

<!-- ============================================================
     FRAGMENTO: scripts (Bootstrap JS + extras)
     Uso: <div th:replace="~{layout/base :: scripts}">
     ============================================================ -->
<div th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
