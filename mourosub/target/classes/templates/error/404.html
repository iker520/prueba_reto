<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Profundidad no encontrada | MouroSub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" th:href="@{/css/mourosub.css}"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ms-primary);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    .bubble {
      position: fixed;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      animation: rise 8s infinite ease-in;
    }
    .bubble:nth-child(1) { width:40px; height:40px; left:10%; animation-delay:0s; animation-duration:7s; }
    .bubble:nth-child(2) { width:20px; height:20px; left:25%; animation-delay:2s; animation-duration:9s; }
    .bubble:nth-child(3) { width:60px; height:60px; left:50%; animation-delay:1s; animation-duration:11s; }
    .bubble:nth-child(4) { width:15px; height:15px; left:70%; animation-delay:3s; animation-duration:8s; }
    .bubble:nth-child(5) { width:35px; height:35px; left:85%; animation-delay:0.5s; animation-duration:10s; }
    @keyframes rise {
      0%   { bottom: -100px; opacity: 0.4; transform: translateX(0); }
      50%  { opacity: 0.2; transform: translateX(20px); }
      100% { bottom: 110%; opacity: 0; transform: translateX(-10px); }
    }
    .error-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 1rem;
      backdrop-filter: blur(8px);
      padding: 3rem 2.5rem;
      text-align: center;
      color: white;
      max-width: 520px;
      width: 100%;
      position: relative;
      z-index: 10;
    }
    .error-code {
      font-size: 7rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: rgba(255,255,255,0.15);
      margin-bottom: -1rem;
    }
    .error-icon {
      font-size: 4rem;
      color: var(--ms-primary-fixed-dim, #a1c9ff);
    }
    .error-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 0.5rem;
    }
    .error-msg {
      color: rgba(255,255,255,0.7);
      line-height: 1.7;
      font-size: 1rem;
      margin-top: 0.75rem;
    }
    .btn-surface {
      background: white;
      color: var(--ms-primary, #004275);
      font-weight: 700;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-surface:hover {
      background: var(--ms-primary-fixed, #d2e4ff);
      color: var(--ms-primary, #004275);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <!-- Burbujas decorativas -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <div class="error-card">
    <div class="error-code">404</div>
    <div class="error-icon mt-2">
      <i class="bi bi-geo-alt"></i>
    </div>
    <h1 class="error-title">¡Zona de buceo no encontrada!</h1>
    <p class="error-msg">
      Parece que te has adentrado en aguas inexploradas. Esta página no existe en
      nuestros mapas de navegación submarina. Quizás la corriente te llevó demasiado lejos.
    </p>
    <div class="mt-4 d-flex flex-column flex-sm-row gap-3 justify-content-center">
      <a th:href="@{/}" href="/" class="btn-surface">
        <i class="bi bi-house-fill me-2"></i>Volver a la Superficie
      </a>
      <a th:href="@{/servicios}" href="/servicios"
         style="background:transparent; border:1px solid rgba(255,255,255,0.4); color:white; font-weight:600; padding:0.75rem 2rem; border-radius:0.5rem; text-decoration:none; transition:all 0.2s;"
         onmouseover="this.style.background='rgba(255,255,255,0.1)'"
         onmouseout="this.style.background='transparent'">
        Ver Servicios
      </a>
    </div>
    <p class="mt-4" style="font-size:0.75rem; color:rgba(255,255,255,0.4);">
      MouroSub Diving School &mdash; Profundidad: 0m
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
