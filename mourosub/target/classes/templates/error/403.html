<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>403 — Zona restringida | MouroSub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" th:href="@{/css/mourosub.css}"/>
  <style>
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--ms-background, #f7f9fb); font-family: 'Inter', sans-serif;
    }
    .error-card {
      background: white; border: 1px solid var(--ms-outline-variant, #c1c7d2);
      border-radius: 1rem; padding: 3rem 2.5rem; text-align: center;
      max-width: 480px; width: 100%;
    }
    .error-icon { font-size: 4rem; color: var(--ms-primary, #004275); }
    .error-code { font-size: 5rem; font-weight: 700; color: var(--ms-primary, #004275); line-height: 1; }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon"><i class="bi bi-lock-fill"></i></div>
    <div class="error-code mt-2">403</div>
    <h1 class="error-page-h1">Zona restringida</h1>
    <p class="error-page-p">
      Esta área requiere certificación de nivel <strong>ADMIN</strong>. No tienes permisos
      para bucear en estas aguas. Contacta con el instructor jefe si crees que es un error.
    </p>
    <div class="mt-4 d-flex gap-3 justify-content-center">
      <a th:href="@{/}" href="/" class="btn btn-ms-primary px-4 py-2 rounded">
        <i class="bi bi-house me-2"></i>Volver al inicio
      </a>
      <a th:href="@{/login}" href="/login" class="btn btn-ms-outline px-4 py-2 rounded">
        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
      </a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
