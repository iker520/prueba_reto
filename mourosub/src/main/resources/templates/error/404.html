<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Profundidad no encontrada | MouroSub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" th:href="@{/css/mourosub.css}"/>
  
</head>
<body class="ms-error-404-page">
  <!-- Burbujas decorativas -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <div class="error-card">
    <div class="error-code">404</div>
    <div class="error-icon mt-2">
      <i class="bi bi-geo-alt"></i>
    </div>
    <h1 class="error-title">¡Zona de buceo no encontrada!</h1>
    <p class="error-msg">
      Parece que te has adentrado en aguas inexploradas. Esta página no existe en
      nuestros mapas de navegación submarina. Quizás la corriente te llevó demasiado lejos.
    </p>
    <div class="mt-4 d-flex flex-column flex-sm-row gap-3 justify-content-center">
      <a th:href="@{/}" href="/" class="btn-surface">
        <i class="bi bi-house-fill me-2"></i>Volver a la Superficie
      </a>
      <a th:href="@{/servicios}" href="/servicios" class="error-btn-outline-glass">
        Ver Servicios
      </a>
    </div>
    <p class="mt-4 error-page-footer">
      MouroSub Diving School &mdash; Profundidad: 0m
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
