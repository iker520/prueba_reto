<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/base :: head(${pageTitle})}"></head>
<body style="padding-top:80px;">

<nav th:replace="~{layout/base :: navbar}"></nav>

<main>
  <!-- ===== BREADCRUMB ===== -->
  <div style="max-width:1280px; margin:0 auto; padding:1rem 1.5rem;">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb" style="font-size:0.85rem;">
        <li class="breadcrumb-item"><a th:href="@{/}" style="color:var(--ms-primary);">Inicio</a></li>
        <li class="breadcrumb-item"><a th:href="@{/servicios}" style="color:var(--ms-primary);">Servicios</a></li>
        <li class="breadcrumb-item active" th:text="${actividad.nombre}">Actividad</li>
      </ol>
    </nav>
  </div>

  <!-- ===== DETALLE ACTIVIDAD ===== -->
  <section style="max-width:1280px; margin:0 auto; padding:0 1.5rem 4rem;">
    <div class="row g-5">
      <!-- Imagen principal -->
      <div class="col-12 col-md-7">
        <div th:if="${actividad.imagenUrl != null}">
          <img th:src="${actividad.imagenUrl}" th:alt="${actividad.nombre}"
               class="img-fluid rounded" style="width:100%; height:420px; object-fit:cover;"/>
        </div>
        <div th:unless="${actividad.imagenUrl != null}"
             class="rounded d-flex align-items-center justify-content-center"
             style="height:420px; background:var(--ms-surface-high);">
          <i class="bi bi-water" style="font-size:5rem; color:var(--ms-primary); opacity:0.4;"></i>
        </div>

        <!-- Contenido HTML (TipTap) -->
        <div th:if="${actividad.descripcionHtml != null and !#strings.isEmpty(actividad.descripcionHtml)}"
             class="ms-rich-content mt-4 p-4 ms-card">
          <div th:utext="${actividad.descripcionHtml}"></div>
        </div>
      </div>

      <!-- Ficha técnica -->
      <div class="col-12 col-md-5">
        <div class="ms-card p-4">
          <span class="ms-badge" th:text="${actividad.tipo}">TIPO</span>
          <h1 class="mt-3" style="font-size:1.8rem; font-weight:700; color:var(--ms-primary);"
              th:text="${actividad.nombre}">Nombre</h1>
          <p class="mt-2" style="color:var(--ms-on-surface-var); line-height:1.7;"
             th:text="${actividad.descripcion}">Descripción</p>

          <hr style="border-color:var(--ms-outline-variant);"/>

          <!-- Detalles técnicos -->
          <table class="table table-borderless" style="font-size:0.9rem;">
            <tbody>
              <tr th:if="${actividad.nivel != null}">
                <td style="color:var(--ms-on-surface-var); width:40%;">
                  <i class="bi bi-bar-chart-fill me-2" style="color:var(--ms-primary);"></i>Nivel
                </td>
                <td class="fw-semibold" th:text="${actividad.nivel}">—</td>
              </tr>
              <tr th:if="${actividad.duracion != null}">
                <td style="color:var(--ms-on-surface-var);">
                  <i class="bi bi-clock me-2" style="color:var(--ms-primary);"></i>Duración
                </td>
                <td class="fw-semibold" th:text="${actividad.duracion}">—</td>
              </tr>
              <tr th:if="${actividad.plazasMaximas != null}">
                <td style="color:var(--ms-on-surface-var);">
                  <i class="bi bi-people me-2" style="color:var(--ms-primary);"></i>Plazas
                </td>
                <td class="fw-semibold" th:text="${actividad.plazasMaximas}">—</td>
              </tr>
              <tr th:if="${actividad.precio != null}">
                <td style="color:var(--ms-on-surface-var);">
                  <i class="bi bi-tag me-2" style="color:var(--ms-primary);"></i>Precio
                </td>
                <td style="font-size:1.5rem; font-weight:700; color:var(--ms-primary);"
                    th:text="${#numbers.formatDecimal(actividad.precio,1,2) + '€'}">—</td>
              </tr>
            </tbody>
          </table>

          <div class="d-grid gap-2 mt-3">
            <a th:href="@{/contacto}" class="btn btn-ms-primary py-3 rounded fw-semibold">
              <i class="bi bi-calendar-plus me-2"></i>Reservar plaza
            </a>
            <a th:href="@{/servicios}" class="btn btn-ms-outline py-2 rounded">
              <i class="bi bi-arrow-left me-2"></i>Volver a Servicios
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
