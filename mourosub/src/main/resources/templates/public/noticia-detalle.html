<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/base :: head(${pageTitle})}"></head>
<body style="padding-top:80px;">
<nav th:replace="~{layout/base :: navbar}"></nav>
<main>
  <!-- Breadcrumb -->
  <div style="max-width:1280px; margin:0 auto; padding:1rem 1.5rem;">
    <nav aria-label="breadcrumb"><ol class="breadcrumb" style="font-size:0.85rem;">
      <li class="breadcrumb-item"><a th:href="@{/}" style="color:var(--ms-primary);">Inicio</a></li>
      <li class="breadcrumb-item"><a th:href="@{/noticias}" style="color:var(--ms-primary);">Noticias</a></li>
      <li class="breadcrumb-item active" th:text="${noticia.titulo}">Artículo</li>
    </ol></nav>
  </div>
  <div style="max-width:1280px; margin:0 auto; padding:0 1.5rem 4rem;">
    <div class="row g-5">
      <article class="col-12 col-lg-8">
        <img th:if="${noticia.imagenUrl != null}" th:src="${noticia.imagenUrl}" th:alt="${noticia.titulo}"
             class="img-fluid rounded w-100 mb-4" style="height:360px; object-fit:cover;"/>
        <div class="d-flex gap-3 mb-3">
          <span class="ms-badge" th:text="${noticia.categoria}">CAT</span>
          <span style="font-size:0.8rem; color:var(--ms-on-surface-var);">
            <i class="bi bi-calendar3 me-1"></i>
            <span th:text="${#temporals.format(noticia.fechaPublicacion,'dd MMMM, yyyy')}">Fecha</span>
          </span>
        </div>
        <h1 style="font-size:2rem; font-weight:700; line-height:1.25;" th:text="${noticia.titulo}">Título</h1>
        <p th:if="${noticia.resumen != null}" class="mt-3"
           style="font-size:1.1rem; color:var(--ms-on-surface-var); border-left:3px solid var(--ms-primary); padding-left:1rem;"
           th:text="${noticia.resumen}">Resumen</p>
        <hr style="border-color:var(--ms-outline-variant); margin:2rem 0;"/>
        <div class="ms-rich-content" th:utext="${noticia.cuerpoHtml}">Contenido...</div>
        <hr style="border-color:var(--ms-outline-variant); margin:2rem 0;"/>
        <a th:href="@{/noticias}" class="btn btn-ms-outline px-4 py-2 rounded">
          <i class="bi bi-arrow-left me-2"></i>Volver a Noticias
        </a>
      </article>
      <aside class="col-12 col-lg-4">
        <div class="ms-card p-4" style="position:sticky; top:96px;">
          <h4 style="font-size:0.9rem; font-weight:700; margin-bottom:0.75rem;">Artículos Recientes</h4>
          <div th:each="reciente : ${ultimasNoticias}" class="mb-3 pb-3"
               style="border-bottom:1px solid var(--ms-surface-high);">
            <a th:href="@{/noticias/{id}(id=${reciente.idNoticia})}" style="text-decoration:none;">
              <span class="news-cat" th:text="${reciente.categoria}">CAT</span>
              <p class="mt-1 mb-0" style="font-size:0.875rem; font-weight:600; line-height:1.4;"
                 th:text="${reciente.titulo}">Título</p>
            </a>
          </div>
          <a th:href="@{/noticias}" class="btn btn-ms-outline w-100 py-2 rounded mt-2">Ver todas</a>
        </div>
      </aside>
    </div>
  </div>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
