<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead('Reservas')}"></head>
<body class="ms-admin-body">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar('Gestión de Reservas')}"></div>
  <div class="p-4">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>

    <!-- Alerta de nuevas reservas pendientes -->
    <div th:if="${reservasPendientesNuevas > 0}"
         class="alert d-flex align-items-center gap-3 mb-4 rounded-3 border-0"
         style="background:rgba(255,193,7,0.15); color:var(--ms-text);">
      <i class="bi bi-bell-fill text-warning fs-5"></i>
      <div>
        <strong th:text="${reservasPendientesNuevas}">0</strong>
        nueva<span th:if="${reservasPendientesNuevas > 1}">s</span>
        reserva<span th:if="${reservasPendientesNuevas > 1}">s</span>
        pendiente<span th:if="${reservasPendientesNuevas > 1}">s</span> de gestión.
      </div>
    </div>

    <!-- Filtro por estado -->
    <div class="d-flex flex-wrap gap-2 mb-4">
      <a th:href="@{/admin/reservas}" class="btn btn-sm rounded-pill px-3"
         th:classappend="${estadoFiltro == ''} ? 'btn-ms-primary' : 'btn-ms-outline'">Todas</a>
      <a th:each="estado : ${estados}"
         th:href="@{/admin/reservas(estado=${estado})}"
         th:text="${estado}"
         class="btn btn-sm rounded-pill px-3"
         th:classappend="${estadoFiltro == estado} ? 'btn-ms-primary' : 'btn-ms-outline'">EST</a>
    </div>

    <div class="ms-card p-0">
      <div class="table-responsive">
        <table class="ms-table">
          <thead><tr>
            <th>#</th><th>Fecha solicitud</th><th>Usuario</th><th>Actividades</th><th>Estado</th><th>Notas</th><th>Acciones</th>
          </tr></thead>
          <tbody>
          <tr th:each="r : ${reservas}">
            <td class="fw-semibold ms-table-id" th:text="'#' + ${r.idReserva}">—</td>
            <td th:text="${#temporals.format(r.fechaReserva,'dd/MM/yyyy HH:mm')}">—</td>

            <!-- Usuario -->
            <td>
              <div th:each="ur : ${r.usuarios}" class="d-flex align-items-center gap-2">
                <span th:if="${ur.usuario != null}" th:text="${ur.usuario.nombre + ' ' + (ur.usuario.apellido1 ?: '')}">—</span>
                <span th:if="${ur.usuario == null}" th:text="${ur.dniUsuario}" class="ms-text-muted small">—</span>
                <!-- Badge buceador -->
                <span th:if="${ur.esBuceador}" title="Buceador"
                      class="badge rounded-pill px-2 py-1 small"
                      style="background:rgba(0,136,204,0.2); color:#0088cc;">
                  <i class="bi bi-water"></i>
                </span>
              </div>
            </td>

            <!-- Actividades -->
            <td>
              <div th:each="ar : ${r.actividades}" class="small">
                <span th:if="${ar.actividad != null}" th:text="${ar.actividad.nombre}">—</span>
                <span th:if="${ar.actividad == null}" class="ms-text-muted">—</span>
                <!-- Fechas si están asignadas -->
                <span th:if="${ar.fechaInicio != null}" class="ms-text-muted"
                      th:text="' (' + ${#temporals.format(ar.fechaInicio,'dd/MM/yy')} + ')'">—</span>
              </div>
            </td>

            <!-- Estado -->
            <td>
              <span class="badge rounded-pill px-3 py-1 fw-semibold"
                    th:classappend="${r.estado == 'PENDIENTE'} ? 'badge-pendiente' :
                                   (${r.estado == 'CONFIRMADA'} ? 'badge-confirmada' :
                                   (${r.estado == 'CANCELADA'} ? 'badge-cancelada' : 'badge-realizada'))"
                    th:text="${r.estado}">Estado</span>
            </td>

            <!-- Notas -->
            <td class="small ms-text-muted" style="max-width:160px; white-space:normal;"
                th:text="${r.notas != null and !#strings.isEmpty(r.notas) ? r.notas : '—'}">—</td>

            <!-- Acciones -->
            <td>
              <div class="d-flex gap-2">
                <a th:href="@{/admin/reservas/{id}(id=${r.idReserva})}"
                   class="btn btn-sm btn-ms-outline px-3 rounded">
                  <i class="bi bi-eye me-1"></i>Ver
                </a>
                <form th:action="@{/admin/reservas/eliminar/{id}(id=${r.idReserva})}" method="post"
                      onsubmit="return confirm('¿Eliminar reserva?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-danger px-3 rounded">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(reservas)}">
            <td colspan="7" class="text-center py-5 ms-table-empty">No hay reservas.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
</body>
</html>
