<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead('Usuarios')}"></head>
<body class="ms-admin-body">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar('Gestión de Usuarios')}"></div>
  <div class="p-4">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>
    <div class="d-flex justify-content-end mb-4">
      <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-ms-primary px-4 py-2 rounded">
        <i class="bi bi-person-plus me-2"></i>Nuevo Usuario
      </a>
    </div>
    <div class="ms-card p-0">
      <div class="table-responsive">
        <table class="ms-table">
          <thead><tr>
            <th>DNI</th><th>Nombre</th><th>Email</th><th>Buceador</th><th>Rol</th><th>Seguro</th><th>Registro</th><th>Acciones</th>
          </tr></thead>
          <tbody>
          <tr th:each="u : ${usuarios}">
            <td class="ms-table-cell-xs" th:text="${u.dniUsuario}">—</td>
            <td class="fw-semibold" th:text="${u.nombre + ' ' + (u.apellido1 != null ? u.apellido1 : '')}">—</td>
            <td class="ms-table-cell-sm" th:text="${u.email}">—</td>
            <td>
              <span th:if="${u.esBuceador}" class="badge bg-info text-dark rounded-pill px-2">
                <i class="bi bi-water"></i> Sí
              </span>
              <span th:unless="${u.esBuceador}" class="text-muted">—</span>
            </td>
            <td>
              <span class="badge rounded-pill px-3"
                    th:classappend="${u.rol == 'ROLE_ADMIN'} ? 'badge-confirmada' : 'badge-completada'"
                    th:text="${u.rol == 'ROLE_ADMIN'} ? 'ADMIN' : 'USER'">—</span>
            </td>
            <td>
              <div th:if="${u.esBuceador and u.seguroAccidentes}">
                <div th:switch="${u.estadoSeguro}">
                  <span th:case="'PENDIENTE'" class="badge bg-warning text-dark"><i class="bi bi-hourglass-split"></i> Pendiente</span>
                  <span th:case="'APROBADO'" class="badge bg-success"><i class="bi bi-check-circle"></i> Aprobado</span>
                  <span th:case="'RECHAZADO'" class="badge bg-danger"><i class="bi bi-x-circle"></i> Rechazado</span>
                  <span th:case="*" class="text-muted">—</span>
                </div>
              </div>
              <span th:unless="${u.esBuceador and u.seguroAccidentes}" class="text-muted">—</span>
            </td>
            <td class="ms-table-cell-xs" th:text="${u.fechaRegistro != null ? #temporals.format(u.fechaRegistro,'dd/MM/yyyy') : '—'}">—</td>
            <td>
              <div class="d-flex gap-2 align-items-center">
                <!-- Validar Seguro (si PENDIENTE) -->
                <div th:if="${u.estadoSeguro == 'PENDIENTE'}" class="d-flex gap-1 border-end pe-2 me-1">
                  <form th:action="@{/admin/usuarios/{dni}/aprobar-seguro(dni=${u.dniUsuario})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-success px-2 rounded" title="Aprobar Seguro"><i class="bi bi-check-lg"></i></button>
                  </form>
                  <form th:action="@{/admin/usuarios/{dni}/rechazar-seguro(dni=${u.dniUsuario})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-danger px-2 rounded" title="Rechazar Seguro"><i class="bi bi-x-lg"></i></button>
                  </form>
                </div>

                <a th:href="@{/admin/usuarios/editar/{dni}(dni=${u.dniUsuario})}"
                   class="btn btn-sm btn-ms-outline px-2 rounded" title="Editar"><i class="bi bi-pencil"></i></a>
                <!-- Documentos (solo buceadores) -->
                <a th:if="${u.esBuceador}"
                   th:href="@{/admin/certificaciones/usuario/{dni}(dni=${u.dniUsuario})}"
                   class="btn btn-sm btn-ms-outline px-2 rounded" title="Gestionar documentos">
                  <i class="bi bi-folder2-open"></i>
                </a>
                <form th:action="@{/admin/usuarios/eliminar/{dni}(dni=${u.dniUsuario})}" method="post"
                      onsubmit="return confirm('¿Eliminar este usuario?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-outline-danger px-2 rounded" title="Eliminar"><i class="bi bi-trash"></i></button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="7" class="text-center py-5 ms-table-empty">
              No hay usuarios registrados.
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
</body>
</html>
