<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/admin-base :: adminHead('Certificaciones MouroSub')}"></head>
<body class="ms-admin-body">
<nav th:replace="~{layout/admin-base :: adminSidebar}"></nav>
<div class="ms-admin-content">
  <div th:replace="~{layout/admin-base :: adminTopbar('Certificaciones MouroSub')}"></div>
  <div class="p-4">
    <div th:replace="~{layout/admin-base :: adminAlerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <p class="text-muted mb-0">Certificaciones expedidas por MouroSub a sus alumnos.</p>
      </div>
      <a th:href="@{/admin/certificaciones/mouro/nueva}" class="btn btn-ms-primary rounded px-4">
        <i class="bi bi-plus-circle me-2"></i>Expedir nueva certificación
      </a>
    </div>

    <div class="ms-card p-0">
      <div class="table-responsive">
        <table class="ms-table">
          <thead><tr>
            <th>ID</th><th>Usuario</th><th>Título</th><th>Entidad</th>
            <th>Expedición</th><th>Vencimiento</th><th>Documento</th><th>Acciones</th>
          </tr></thead>
          <tbody>
          <tr th:each="c : ${certs}">
            <td class="fw-semibold" th:text="${c.numCertificacion}">—</td>
            <td>
              <div th:text="${c.usuario.nombre + ' ' + c.usuario.apellido1}">—</div>
              <small class="text-muted" th:text="${c.usuario.email}">—</small>
            </td>
            <td th:text="${c.titulo}">—</td>
            <td th:text="${c.entidadCertificadora ?: 'MouroSub'}">—</td>
            <td th:text="${c.fechaInicio != null ? #temporals.format(c.fechaInicio,'dd/MM/yyyy') : '—'}">—</td>
            <td th:text="${c.fechaFin != null ? #temporals.format(c.fechaFin,'dd/MM/yyyy') : 'Sin venc.'}">—</td>
            <td>
              <a th:if="${c.documentoUrl != null}" th:href="${c.documentoUrl}" target="_blank"
                 class="btn btn-sm btn-ms-outline rounded">
                <i class="bi bi-file-earmark-pdf"></i> Ver
              </a>
              <span th:unless="${c.documentoUrl != null}" class="text-muted">Sin doc.</span>
            </td>
            <td>
              <form th:action="@{/admin/certificaciones/mouro/{id}/eliminar(id=${c.numCertificacion})}"
                    method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-danger rounded"
                        onclick="return confirm('¿Eliminar esta certificación?')">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(certs)}">
            <td colspan="8" class="text-center py-4 ms-table-empty">
              No hay certificaciones expedidas todavía.
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{layout/admin-base :: adminScripts}"></div>
</body>
</html>
