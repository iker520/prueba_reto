<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<!-- ============================================================
     FRAGMENTO: adminHead
     ============================================================ -->
<head th:fragment="adminHead(pageTitle)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle} + ' | MouroSub Admin'">MouroSub Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" th:href="@{/css/mourosub.css}"/>
</head>

<!-- ============================================================
     FRAGMENTO: adminSidebar
     ============================================================ -->
<nav th:fragment="adminSidebar" class="ms-admin-sidebar d-flex flex-column" id="adminSidebar">
  <!-- Brand -->
  <a th:href="@{/admin}" class="sidebar-brand">
    <i class="bi bi-water me-2"></i>MouroSub<span style="font-weight:400; font-size:0.9rem;"> Admin</span>
  </a>

  <!-- Navigation -->
  <div class="px-2 py-3 flex-grow-1">
    <p style="font-size:0.65rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.4); padding:0 0.75rem; margin-bottom:0.5rem;">General</p>

    <a th:href="@{/admin}"
       th:classappend="${#httpServletRequest.requestURI == '/admin' or #httpServletRequest.requestURI == '/admin/'} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <a th:href="@{/admin/reservas}"
       th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/reservas')} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-calendar-check"></i> Reservas
    </a>

    <p style="font-size:0.65rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.4); padding:0 0.75rem; margin:1rem 0 0.5rem;">Contenido</p>

    <a th:href="@{/admin/actividades}"
       th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/actividades')} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-grid-3x3-gap"></i> Actividades
    </a>

    <a th:href="@{/admin/noticias}"
       th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/noticias')} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-newspaper"></i> Noticias
    </a>

    <p style="font-size:0.65rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.4); padding:0 0.75rem; margin:1rem 0 0.5rem;">Personas</p>

    <a th:href="@{/admin/instructores}"
       th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/instructores')} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-person-badge"></i> Instructores
    </a>

    <a th:href="@{/admin/usuarios}"
       th:classappend="${#httpServletRequest.requestURI.startsWith('/admin/usuarios')} ? 'active' : ''"
       class="nav-link">
      <i class="bi bi-people"></i> Usuarios
    </a>
  </div>

  <!-- Footer del sidebar -->
  <div style="border-top:1px solid rgba(255,255,255,0.15); padding:1rem 1.25rem;">
    <a th:href="@{/}" class="nav-link" style="font-size:0.8rem;">
      <i class="bi bi-arrow-left-circle"></i> Ver sitio web
    </a>
    <form th:action="@{/logout}" method="post" class="mt-1">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="nav-link border-0 bg-transparent w-100 text-start" style="font-size:0.8rem;">
        <i class="bi bi-box-arrow-left"></i> Cerrar sesión
      </button>
    </form>
  </div>
</nav>

<!-- ============================================================
     FRAGMENTO: adminTopbar
     ============================================================ -->
<div th:fragment="adminTopbar(pageTitle)" class="ms-admin-topbar">
  <div>
    <h5 class="mb-0 fw-semibold" style="color:var(--ms-on-surface);" th:text="${pageTitle}">Panel</h5>
  </div>
  <div class="d-flex align-items-center gap-3">
    <span style="font-size:0.85rem; color:var(--ms-on-surface-var);">
      <i class="bi bi-person-circle me-1"></i>
      <span sec:authentication="name">admin</span>
    </span>
  </div>
</div>

<!-- ============================================================
     FRAGMENTO: adminScripts
     ============================================================ -->
<div th:fragment="adminScripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

<!-- ============================================================
     FRAGMENTO: adminAlerts — Muestra flash messages
     ============================================================ -->
<div th:fragment="adminAlerts">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i>
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i>
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>

</html>
