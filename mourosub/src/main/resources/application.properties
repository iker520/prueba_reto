# =============================================
# MouroSub - Configuración de la Aplicación
# Los valores sensibles se cargan desde .env
# =============================================

# Carga el archivo .env si existe (native Spring Boot 2.4+)
spring.config.import=optional:file:.env[.properties]

# Nombre de la aplicación (aparece en logs y métricas)
spring.application.name=MouroSub

server.address=0.0.0.0
server.port=${APP_PORT:8080}

# --- Base de Datos MariaDB ---
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/pruebas_mourosub}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- Mensajes de error amigables ---
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# --- Multipart (imágenes) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Logging ---
logging.level.com.example.mourosub=INFO
logging.level.org.springframework.security=WARN

# --- Subida de ficheros ---
app.uploads.path=${UPLOADS_PATH:${user.home}/mourosub-uploads}

# --- Spring Boot Actuator (monitorización y healthcheck Docker) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.app.enabled=true

# --- Seed de datos iniciales (solo en entornos de desarrollo/demo) ---
app.seed.enabled=${APP_SEED_ENABLED:false}
